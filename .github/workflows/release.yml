name: Package and release

on:
  push:
    tags:
      - "**"

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

    steps:
      - name: Clone project
        uses:
          actions/checkout@v2
        with:
          fetch-depth: 20
      - name: Package and release classic
        uses: BigWigsMods/packager@master
        with:
          args: -g classic
      - name: Package and release tbc
        uses: BigWigsMods/packager@master
        with:
          args: -g bcc
      - name: Package and release mists
        uses: BigWigsMods/packager@master
        with:
          args: -g mists
      - name: Package and release retail
        uses: BigWigsMods/packager@master
        with:
          # retail builds get no suffix by default. {file template}:{upload label template}
          args: -g retail -n "{package-name}-{project-version}{nolib}-retail:{project-version}-retail{nolib}"
      - name: Package and release forever
        uses: BigWigsMods/packager@master
        with:
          args: -g forever
